<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="dashboard-title dashboard-desc">
  <title id="dashboard-title">Local Video Engine historical performance</title>
  <desc id="dashboard-desc">One RTX 5090: warm task median 9.50 seconds from four samples, first-task median 25.11 seconds from two samples. H3-family video with audio, 640 by 384, 107 frames, 24 FPS and eight steps. Processing and saving included; process startup separate and repeated conditioning warm. Twelve saved outputs passed full video and audio decode and same-profile repeatability. The overall coordinator run failed. No public-export GPU test, quality proof or attributable patch-bundle gain.</desc>
